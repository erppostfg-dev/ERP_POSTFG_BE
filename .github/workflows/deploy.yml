# Backend CI/CD: branch -> environment -> EC2.
#
#   push to dev   -> GitHub Environment "dev"  -> dev ECR + dev instance
#   push to main  -> GitHub Environment "prod" -> prod ECR + prod instance (after approval, if the
#                    prod Environment has required reviewers)
#   Run workflow  -> same mapping from the chosen branch; with image_tag set, that existing image
#                    is deployed again without building (rollback)
#
# Each GitHub Environment holds: secret AWS_ROLE_ARN (Terraform output app_deploy_role_arn),
# variables ECR_REPOSITORY (app_ecr_repository_url) and EC2_INSTANCE_ID (app_instance_id).
# Optional secret SUBMODULE_TOKEN: read access to the ocr-service submodule's repository.
# The app's settings are not here: the instance reads /mcaffeine-erp-post-fg/<env>/api/env from SSM.
name: deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag (a git SHA) to deploy again; empty = build and deploy this commit
        required: false
        default: ""

permissions:
  id-token: write # GitHub OIDC token for the AWS deploy role
  contents: read

# One deploy at a time per branch; a second push waits instead of racing the first.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  check:
    name: typecheck
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

  deploy:
    name: deploy ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Check the Environment's settings
        run: |
          missing=""
          [ -n "${{ secrets.AWS_ROLE_ARN }}" ] || missing="$missing secret:AWS_ROLE_ARN"
          [ -n "$ECR_REPOSITORY" ] || missing="$missing variable:ECR_REPOSITORY"
          [ -n "$EC2_INSTANCE_ID" ] || missing="$missing variable:EC2_INSTANCE_ID"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Environment '$ENV_NAME' is missing:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Fetch ocr-service (submodule)
        if: inputs.image_tag == ''
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          if [ ! -f .gitmodules ]; then
            echo "No submodules: ocr-service is part of this repository."
            exit 0
          fi
          if [ -z "$SUBMODULE_TOKEN" ]; then
            echo "::warning::SUBMODULE_TOKEN is not set: the image is built without the ocr-service scripts (OCR will not run)."
            exit 0
          fi
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
          git config --global --unset url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-deploy-backend-${{ env.ENV_NAME }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: inputs.image_tag == ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        if: inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-${{ env.ENV_NAME }}
          cache-to: type=gha,mode=max,scope=backend-${{ env.ENV_NAME }}

      - name: Check the image exists (redeploy)
        if: inputs.image_tag != ''
        run: |
          aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imagePushedAt' --output text \
            || { echo "::error::Image tag $IMAGE_TAG not found in $ECR_REPOSITORY"; exit 1; }

      - name: Deploy on the instance (SSM Run Command)
        run: |
          IMAGE="$ECR_REPOSITORY:$IMAGE_TAG"
          SCRIPT="$(base64 -w0 deploy/deploy.sh)"
          PARAMS="$(jq -n \
            --arg script "$SCRIPT" --arg env "$ENV_NAME" --arg image "$IMAGE" --arg region "$AWS_REGION" \
            '{commands: ["echo \($script) | base64 -d > /tmp/post-fg-deploy.sh", "bash /tmp/post-fg-deploy.sh \($env) \($image) \($region)"], executionTimeout: ["1200"]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "post-fg backend ${ENV_NAME} ${IMAGE_TAG:0:12}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)"
          echo "SSM command $COMMAND_ID on $EC2_INSTANCE_ID"

          # Wait up to 20 minutes, then print the instance's output.
          for _ in $(seq 1 240); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text
          ERRORS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text)"
          [ -z "$ERRORS" ] || { echo "--- stderr ---"; echo "$ERRORS"; }

          echo "Deploy status: $STATUS"
          {
            echo "## Backend → $ENV_NAME"
            echo "- Image: \`$IMAGE\`"
            echo "- Instance: \`$EC2_INSTANCE_ID\`"
            echo "- Status: **$STATUS**"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "Success" ]
